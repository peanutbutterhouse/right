<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Side-Scroller Controller</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body { 
            margin: 0; 
            background-color: #222; 
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        model-viewer {
            width: 350px;
            height: 350px;
            position: absolute;
            bottom: 50px;
            left: 50px;
            /* Removes the default white flash on load */
            --poster-color: transparent; 
        }

        .ui {
            position: fixed;
            top: 20px;
            left: 20px;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            pointer-events: none;
            text-shadow: 2px 2px #000;
        }
    </style>
</head>
<body>

    <div class="ui">STATUS: OPERATIONAL<br>INPUT: WASD TO MOVE</div>

    <model-viewer 
        id="player"
        src="idle.glb" 
        shadow-intensity="1" 
        autoplay
        /* 1. Low FOV creates the "flat" 2D look */
        field-of-view="12deg"
        /* 2. 90deg starts the camera at the side profile */
        camera-orbit="90deg 75deg 10m"
        interaction-prompt="none"
        disable-zoom>
    </model-viewer>

    <script>
        const player = document.getElementById('player');
        const speed = 8;
        
        const keys = { w: false, a: false, s: false, d: false };
        let posX = 100;
        let posY = 100;

        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = true;
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (keys.hasOwnProperty(key)) keys[key] = false;
        });

        function gameLoop() {
            if (keys.w) posY += speed;
            if (keys.s) posY -= speed;
            
            if (keys.a) {
                posX -= speed;
                // Look Left (270 degrees)
                player.cameraOrbit = "270deg 75deg 10m";
            }
            if (keys.d) {
                posX += speed;
                // Look Right (90 degrees)
                player.cameraOrbit = "90deg 75deg 10m";
            }

            // Apply movement to the element
            player.style.bottom = posY + 'px';
            player.style.left = posX + 'px';

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
